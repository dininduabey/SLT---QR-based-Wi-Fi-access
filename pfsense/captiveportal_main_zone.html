<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLT WiFi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(135deg,#003d2b,#00603f);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:32px 24px;max-width:360px;
width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.logo{color:#005c42;font-size:24px;font-weight:800;margin-bottom:2px}
.sub{color:#888;font-size:13px;margin-bottom:22px}
.qr-icon{font-size:56px;margin:10px 0}
h2{color:#222;font-size:19px;margin:6px 0 16px}
.steps{text-align:left;background:#f4f7f6;border-radius:14px;padding:18px;margin-bottom:18px}
.step{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;font-size:15px;color:#333;line-height:1.4}
.step:last-child{margin-bottom:0}
.step-num{background:#005c42;color:#fff;border-radius:50%;min-width:26px;height:26px;
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.hint{font-size:12px;color:#999;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">SLT Mobitel</div>
  <div class="sub">Event Wi-Fi Access</div>
  <div class="qr-icon">📷</div>
  <h2>Get Connected in 3 Steps</h2>
  <div class="steps">
    <div class="step"><div class="step-num">1</div><div>Tap <b>&#10005;</b> at the top, then choose <b>"Use Without Internet"</b></div></div>
    <div class="step"><div class="step-num">2</div><div>Open your <b>Camera</b> app and scan the QR code shown at the venue</div></div>
    <div class="step"><div class="step-num">3</div><div>Enter your phone number and the OTP to connect</div></div>
  </div>
  <div class="hint">Internet access is provided free for this event by SLT Mobitel.</div>
</div>
</body>
</html>
