<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLT WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:linear-gradient(135deg,#003d2b,#00603f);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border-radius:20px;padding:28px 22px;max-width:360px;width:100%;
text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.logo{color:#005c42;font-size:22px;font-weight:800}
.sub{color:#888;font-size:12px;margin-bottom:18px}
h2{color:#222;font-size:18px;margin:6px 0 16px}
.steps{text-align:left;background:#f4f7f6;border-radius:14px;padding:16px;margin-bottom:14px}
.step{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;font-size:14px;color:#333;line-height:1.45}
.step:last-child{margin-bottom:0}
.num{background:#005c42;color:#fff;border-radius:50%;min-width:24px;height:24px;
display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
border-radius:6px;background:#005c42;color:#fff;font-weight:700;font-size:14px;vertical-align:middle;margin:0 2px}
.ic-dots{flex-direction:column;gap:2px;line-height:0}
.ic-dots span{width:3px;height:3px;background:#fff;border-radius:50%;display:block}
.hint{font-size:11px;color:#999;margin-top:6px}
.os-tag{display:inline-block;font-size:10px;color:#aaa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
b{color:#005c42}
</style>
</head>
<body>
<div class="card">
  <div class="logo">SLT Mobitel</div>
  <div class="sub">Event Wi-Fi Access</div>
  <div class="os-tag" id="ostag"></div>
  <h2>Get Connected</h2>
  <div class="steps" id="steps"><!-- filled by JS --></div>
  <div class="hint">Free Wi-Fi provided for this event by SLT Mobitel.</div>
</div>

<script>
(function(){
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  var steps = document.getElementById('steps');
  var tag = document.getElementById('ostag');

  var closeIOS =
    '<div class="step"><span class="num">1</span><div>Tap the <span class="ic">&#10005;</span> button at the top, then choose <b>&ldquo;Use Without Internet&rdquo;</b></div></div>';
  var closeAndroid =
    '<div class="step"><span class="num">1</span><div>Tap the <span class="ic ic-dots"><span></span><span></span><span></span></span> menu at the top, then choose <b>&ldquo;Use this network as is&rdquo;</b></div></div>';
  var closeGeneric =
    '<div class="step"><span class="num">1</span><div>Close this window and stay connected to <b>SLT WiFi</b></div></div>';

  var step2 =
    '<div class="step"><span class="num">2</span><div>Open your <b>Camera</b> app and point it at the <b>QR code</b> on the screen</div></div>';
  var step3 =
    '<div class="step"><span class="num">3</span><div>Enter your <b>mobile number</b> and the <b>OTP</b> to get online</div></div>';

  var first;
  if (isIOS)       { first = closeIOS;     tag.textContent = 'iPhone / iPad'; }
  else if (isAndroid) { first = closeAndroid; tag.textContent = 'Android'; }
  else             { first = closeGeneric; tag.textContent = ''; }

  steps.innerHTML = first + step2 + step3;
})();
</script>
</body>
</html>
